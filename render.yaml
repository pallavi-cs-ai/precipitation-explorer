# Free service: forecast cache is rebuilt after restart or idle spin-down.
services:
  - type: web
    name: pluvia-precipitation
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: FORECAST_DATA_DIR
        value: /tmp/pluvia/forecasts
