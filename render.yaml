# Paid service + persistent disk. Review Render's displayed cost before deploying.
services:
  - type: web
    name: pluvia-precipitation
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: FORECAST_DATA_DIR
        value: /var/data/forecasts
    disk:
      name: forecast-data
      mountPath: /var/data
      sizeGB: 1
